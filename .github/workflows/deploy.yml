name: Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write   # needed for OIDC role assumption

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # Configure AWS credentials using OIDC role assumption
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1   # adjust if needed

      # Deploy to EC2 via SSM Run Command
      - name: Deploy to EC2
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Pull the latest image on the instance
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy test-app container" \
            --parameters commands=[
              "docker pull $IMAGE",
              "docker rm -f test-app || true",
              "docker run -d --name test-app -p 3000:3000 --restart unless-stopped $IMAGE"
            ] \
            --output json
